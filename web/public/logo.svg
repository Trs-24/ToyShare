  <path d="M29 25.5 Q32 28 35 25.5" stroke="#0f766e" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <ellipse cx="16" cy="36" rx="5" ry="8" fill="#2dd4bf" transform="rotate(-15 16 36)"/>
  <ellipse cx="48" cy="36" rx="5" ry="8" fill="#2dd4bf" transform="rotate(15 48 36)"/>
  <!-- Recycling arrows overlay  -->
  <g transform="translate(24, 44) scale(0.35)" fill="#fff" opacity="0.7">
    <path d="M22 12l-4-4v3C9.37 11 2 17.37 2 26h3c0-6.63 5.37-12 12-12v3l4-5z"/>
    <path d="M26 26c0 6.63-5.37 12-12 12v-3l-4 5 4 4v-3c8.63 0 15-6.37 15-15h-3z"/>
  </g>
