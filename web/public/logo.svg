<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Teddy bear body -->
  <circle cx="32" cy="38" r="18" fill="#2dd4bf" opacity="0.9"/>
  <!-- Teddy bear head -->
  <circle cx="32" cy="20" r="14" fill="#2dd4bf"/>
  <!-- Ears -->
  <circle cx="20" cy="10" r="6" fill="#2dd4bf"/>
  <circle cx="44" cy="10" r="6" fill="#2dd4bf"/>
  <circle cx="20" cy="10" r="3.5" fill="#14b8a6"/>
  <circle cx="44" cy="10" r="3.5" fill="#14b8a6"/>
  <!-- Belly -->
  <ellipse cx="32" cy="40" rx="10" ry="11" fill="#5eead4" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="27" cy="18" r="2.5" fill="#fff"/>
  <circle cx="37" cy="18" r="2.5" fill="#fff"/>
  <circle cx="27.8" cy="18.5" r="1.2" fill="#0f172a"/>
  <circle cx="37.8" cy="18.5" r="1.2" fill="#0f172a"/>
  <!-- Nose -->
  <ellipse cx="32" cy="23" rx="2.5" ry="1.8" fill="#0f766e"/>
